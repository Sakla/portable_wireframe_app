name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the zip to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/fetch_models.py') }}

      - name: Download offline models
        run: python tools/fetch_models.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable app
        run: pyinstaller --noconfirm --clean packaging/wireframe_studio.spec

      - name: Add models and notes
        shell: pwsh
        run: |
          Copy-Item -Recurse models dist/WireframeStudio/models
          Copy-Item packaging/README.txt dist/WireframeStudio/README.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/WireframeStudio/THIRD_PARTY_NOTICES.md

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist/WireframeStudio/WireframeStudio.exe `
               -ArgumentList '--self-test', '--require-models', '--log', "$PWD/selftest.log" `
               -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/WireframeStudio -DestinationPath WireframeStudio-win64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WireframeStudio-win64
          path: WireframeStudio-win64.zip
          compression-level: 0
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WireframeStudio-win64.zip
